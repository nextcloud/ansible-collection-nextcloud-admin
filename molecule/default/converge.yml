---
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Set parameter for a specific version of Nextcloud.
      ansible.builtin.set_fact:
        nextcloud_version_major: "{{ molecule_nc[2:] }}"
      when:
        - molecule_nc not in [ "", "latest" ]
        - molecule_nc is match("nc[0-9]{2,3}")
      vars:
        molecule_nc: "{{ lookup('env', 'MOLECULE_NC') }}"
    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_os_family == 'Debian'
      changed_when: false
    - name: Install gpg-agent
      ansible.builtin.package:
        name: gpg-agent
        state: present
      when: ansible_distribution == 'Ubuntu'
  vars:
    nextcloud_install_db: false
    nextcloud_db_backend: sqlite
    nextcloud_version_channel: "releases"
    nextcloud_get_latest: true
    nextcloud_disable_websrv_default_site: true
  tasks:
    - name: Install Nextcloud and check its services
      block:
        - name: Include install_nextcloud role
          ansible.builtin.import_role:
            name: nextcloud.admin.install_nextcloud

        - name: Run pending handlers inside the block
          ansible.builtin.meta: flush_handlers
      rescue:
        - name: Collect diagnostics
          ansible.builtin.shell: |
            for f in /usr/sbin/php-fpm[0-9]*; do echo "== $f -t"; "$f" -t 2>&1; done
            echo "== systemctl"; systemctl status 'php*-fpm' --no-pager -l 2>&1
            echo "== journal"; journalctl --no-pager -n 100 -u 'php*-fpm' 2>&1
            echo "== /run/php"; ls -la /run/php 2>&1
            echo "== pool.d"; ls -la /etc/php/*/fpm/pool.d 2>&1
            echo "== listening sockets"; ss -ltnp 2>&1
          changed_when: false
          failed_when: false
          register: _diagnostics

        - name: Display diagnostics
          ansible.builtin.debug:
            msg: "{{ _diagnostics.stdout_lines }}"

        - name: Fail after collecting diagnostics
          ansible.builtin.fail:
            msg: Nextcloud installation failed, see the diagnostics above.
  post_tasks:
    - name: Get server Status.
      nextcloud.admin.run_occ:
        command: status
        nextcloud_path: "{{ nextcloud_webroot }}"
      changed_when: false
      register: _server_status
    - name: Display server Status.
      ansible.builtin.debug:
        var: _server_status
