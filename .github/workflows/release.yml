---
name: Release
"on":
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: tag to release (e.g. 2.4.0)
        required: true
        type: string

env:
  PYTHON_VERSION: '3.12'

jobs:
  prepare:
    name: check-tag
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      tests_done: ${{ steps.check.outputs.tests_done }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Check galaxy.yml version matches the tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version=$(grep '^version:' galaxy.yml | awk '{ print $2 }')
          if [ "$version" != "$TAG" ]; then
            echo "galaxy.yml version ($version) does not match tag ($TAG)" >&2
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?head_sha=$sha&status=success&per_page=1" --jq '.total_count')
          tests_done=false
          if [ "$count" -gt 0 ]; then tests_done=true; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tests_done=$tests_done" >> "$GITHUB_OUTPUT"

  tests:
    name: tests
    needs: prepare
    if: needs.prepare.outputs.tests_done != 'true'
    uses: ./.github/workflows/main.yml
    with:
      full: true

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs:
      - prepare
      - tests
    if: ${{ always() && needs.prepare.result == 'success' && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ansible
        run: |
          pip install --upgrade --constraint=.github/workflows/constraints.txt pip
          pip install --upgrade --constraint=.github/workflows/constraints.txt ansible

      - name: Release to Ansible Galaxy
        env:
          ANSIBLE_GALAXY_TOKEN: ${{ secrets.GALAXY_TOKEN }}
        run: >-
          ansible-playbook -i 'localhost,' galaxy-deploy.yml
          -e "github_tag=${{ needs.prepare.outputs.tag }}"
          -e "ansible_namespace=$(echo ${{ github.repository }} | cut -d/ -f1)"
          -e "collection=admin"
